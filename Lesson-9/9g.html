<!DOCTYPE html>
<html>
<head>
    <style>
        p{
            font-family: Arial;
        }

        .card{
            width: 150px;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.3);
            display: inline-block;
            margin-right: 10px;
        }

        .cat-image{
            height: 170px;
            width: 150px;
            object-fit: cover;
            object-position: center;
        }

        .name{
            font-weight: bold;
            font-size: 15px;
            margin-top: 2px;
            margin-left: 5px;
            margin-bottom: 0px;
        }

        .followers{
            font-size: 12px;
            color: rgb(124, 122, 122);
            margin-top: 2px;
            margin-left: 3px;
            margin-bottom: 0px;
        }
        
        .add-button{
            background-color: rgb(42, 95, 209);
            color: white;
            border-radius: 5px;
            margin-top: 5px;
            margin-left: 5px;
            border: none;
            margin-bottom: 10px;
            padding-left: 10px;
            padding-right: 10px;
            padding-top: 7px;
            padding-bottom: 7px;
        }
    </style>
</head>
<body>
    <div class="card">
        <img class="cat-image" src="/thumbnails/photo-1514888286974-6c03e2ca1dba_fm=jpg&q=60&w=3000&auto=format&fit=crop&ixlib=rb-4.1.webp">
        <p class="name">Oliver</p>
        <p class="followers">2 mutual friends</p>
        <button class="add-button">Add Friend</button>
    </div>

    <div class="card">
        <img class="cat-image" src="/Lesson-9/cat-image2.webp">
        <p class="name">Mimi</p>
        <p class="followers">3 mutual friends</p>
        <button class="add-button">Add Friend</button>
    </div>

    <div class="card">
        <img class="cat-image" src="/Lesson-9/dog-image.webp">
        <p class="name">Rex</p>
        <p class="followers">4 mutual friends</p>
        <button class="add-button">Add Friend</button>
    </div>
</body>
</html>
