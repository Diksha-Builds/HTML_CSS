<!DOCTYPE html>
<html>
    <head>
        <title>7f exercise</title>
        <style>
            p{
                font-family: Arial;
                color: rgb(100, 97, 97);
            }

            .email-bar{
                border-radius: 5px;
                border: solid;
                width: 300px;
                padding-bottom: 7px;
                padding-top: 7px;
                padding-right: 16px;
                padding-left: 16px;
            }

            .agree-button{
                width: 335px;
                background-color: rgb(56, 87, 210);
                font-size: 15px;
                color: white;
                border: none;
                border-radius: 100px;
                padding-bottom: 10px;
                padding-top: 10px;
                padding-right: 16px;
                padding-left: 16px;
            }
        </style>
    </head>

    <body>
        <p>Email</p>
        <input class="email-bar" type="text">
        <p class="description">By clicking Agree & Join, you agree to the Privacy Policy</p>
        <button class="agree-button">Agree & Join</button>
    </body>
</html>
