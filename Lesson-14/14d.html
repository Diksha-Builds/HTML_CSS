<!DOCTYPE html>
<html>
<head>
    <style>
        body{
            height: 3000px;
        }

        .sidebar{
            position: fixed;
            right: 0px;
            bottom: 0;
            top: 0;
            background-color: green;
            color: white;
            width: 100px;
        }

        .overlay{
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .modal{
            background-color: white;
            width: 300px;
            padding-top: 15px;
            padding-bottom: 15px;
            padding-left: 15px;
            padding-right: 15px;
            border-radius: 5px;
            font-family: Arial;
        }

        .modal-title{
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .modal-info{
            margin-bottom: 12px;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        right sidebar
    </div>

    <div class="overlay">
        <div class="modal">
            <div class="modal-title">Modal Title</div>
            <div class="modal-info">This is a modal</div>
            <button>Close</button>
        </div>
    </div>
</body>
</html>
