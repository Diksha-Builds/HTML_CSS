<!DOCTYPE html>
<html>
<head>
    <style>
        body{
            height: 3000px;
        }

        div{
            font-family: Arial;
        }

        .sidebar-1{
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            background-color: rgb(33, 33, 33);
            padding-top: 10px;
            padding-right: 10px;
            padding-left: 10px;
        }

        .picture{
            height: 50px;
            width: 50px;
            object-fit: cover;
            border-radius: 25px;
            margin-bottom: 10px;
        }

        .sidebar-2{
            position: fixed;
            top: 0;
            bottom: 0;
            left: 70px;
            background-color: rgb(55, 55, 55);
            padding-top: 15px;
            padding-left: 15px;
            padding-right: 15px;
        }

        .header{
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .name{
            color: white;
            font-size: 14px;
        }

        .plus{
            font-size: 25px;
            color: rgb(150, 150, 150);
        }

        .channel{
            color: rgb(150, 150, 150);
            margin-bottom: 16px;
        }
    </style>
</head>
<body>
    <div class="sidebar-1">
        <div>
            <img class="picture" src="cat1.webp">
        </div>
        <div>
            <img class="picture" src="cat2.webp">
        </div>
        <div>
            <img class="picture" src="dog.webp">
        </div>
    </div>

    <div class="sidebar-2">
        <div class="header">
            <div class="name">INFO</div>
            <div class="plus">+</div>
        </div>
        <div class="channel"># new-videos</div>
        <div class="channel"># updates</div>
        <div class="channel"># faq</div>
    </div>
</body>
</html>
