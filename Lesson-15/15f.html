<!DOCTYPE html>
<html>
<head>
    <style>
        .container{
            position: relative;
            display: inline-block;
        }

        .shirt-image{
            width: 300px;
            height: 300px;
            object-fit: cover;
        }

        .discount{
            position: absolute;
            top: 10px;
            right: 0px;
            background-color: black;
            color: white;
            padding-left: 10px;
            padding-right: 10px;
            padding-top: 7px;
            padding-bottom: 7px;
            font-family: Arial;
        }

        .bottom-overlay{
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 80px;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: rgba(255, 255, 255, 0.8);
        }

        .add-to-cart-button{
            border: black;
            background-color: white;
            border-style: solid;
            border-width: 1px;
            padding-left: 10px;
            padding-right: 10px;
            padding-top: 7px;
            padding-bottom: 7px;
        }
    </style>
</head>
<body>
    <div class="container">
        <img class="shirt-image" src="/Lesson-15/shirt-image.webp">
        <div class="discount">20% OFF</div>
        <div class="bottom-overlay">
            <button class="add-to-cart-button">Add to Cart</button>
        </div>
    </div>
</body>
</html>
