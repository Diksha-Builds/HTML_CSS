<!DOCTYPE html>
<html>
<head>
    <style>
        .flexbox{
            display: flex;
            flex-direction: row;
            height: 50px;
        }

        .column1{
            width: 100px;
            background-color: lightpink;
        }

        .column2{
            width: 200px;
            background-color: lightblue;
        }

        .row2{
            display: flex;
            flex-direction: row;
            justify-content: space-between;
        }

        .two{
            background-color: black;
            color: white;
        }
    </style>
</head>
<body>
    <div class="flexbox">
        <div class="column1"></div>
        <div class="column2">
            <div>row1</div>
            <div class="row2">
                <div class="two">row2</div>
                <div class="two">row2</div>
            </div>
    </div>
</body>
</html>
