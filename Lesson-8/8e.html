<!DOCTYPE html>
<html>
<head>
    <title>Uber request-a-ride form</title>
    <style>
        p{
            font-family: Arial;
            font-size: 30px;
            margin-top: 0;
            margin-bottom: 15px;
        }
        input{
            display: block;
            margin-top: 10px;
            margin-bottom: 10px;
            padding-bottom: 10px;
            padding-top: 10px;
            padding-right: 16px;
            padding-left: 16px;
            width: 250px;
            border: none;
            background-color: rgb(242, 239, 239);
        }

        button{
            margin-top: 15px;
            padding-bottom: 10px;
            padding-top: 10px;
            padding-left: 16px;
            padding-right: 16px;
            border: none;
        }

        .request-button{
            width: 110px;
            background-color: black; 
            color: white; 
            margin-right: 10px;
        }

        .schedule-button{
            width: 140px;
            background-color: rgb(242, 239, 239);
        }
    </style>
</head>
<body>
    <p>Request a ride now</p>
    <input type="text" placeholder="Enter pickup location">
    <input type="text" placeholder="Enter destination"> 
    <button class="request-button">Request now</button>
    <button class="schedule-button">Schedule for later</button>
</body>
</html>
