<!DOCTYPE html>
<html>
    <head>
        <title>7g exercise</title>

        <style>
            .cat-image{
                width: 50px;
                height: 50px;
                border-radius: 25px;
                object-fit: cover;
                vertical-align: middle;
                margin-right: 5px;
            }

            .textbox{
                font-family: Arial;
                color: rgb(100, 97, 97);
                font-size: 15px;
                vertical-align: middle;
                width: 200px;
                border: none;
                margin-right: 10px;
            }

            .tweet-button{
                color: white;
                font-family: Arial;
                background-color: rgb(56, 87, 210);
                font-weight: bold;
                padding-bottom: 7px;
                padding-top: 7px;
                padding-right: 16px;
                padding-left: 16px;
                border-radius: 20px;
                border: solid;
            }
        </style>
    </head>

    <body>
        <img class="cat-image" src="../thumbnails/photo-1514888286974-6c03e2ca1dba_fm=jpg&q=60&w=3000&auto=format&fit=crop&ixlib=rb-4.1.webp">
        <input class="textbox" type="text" placeholder="What's happening?">
        <button class="tweet-button">Tweet</button>
    </body>
</html>
