<!DOCTYPE html>
<html>
<head>
    <style>
        div{
            font-family: Arial;
        }

        .border{
            border-width: 1px;
            width: 300px;
            border-radius: 5px;
            border-style: solid;
        }

        .flexbox{
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            margin-bottom: 10px;
            margin-left: 10px;
            margin-right: 10px;
        }

        .notifications{
            background-color: rgb(81, 81, 240);
            border-radius: 15px;
            color: white;
            padding-left: 12px;
            padding-right: 12px;
            padding-top: 7px;
            padding-bottom: 7px;
        }
    </style>
</head>
<body>
    <div class="border">
        <div class="flexbox">
            <div>Home</div>
            <div class="notifications">14</div>
        </div>

        <div class="flexbox">
            <div>Notifications</div>
            <div class="notifications">3</div>
        </div>

        <div class="flexbox">
            <div>Messages</div>
            <div class="notifications">5</div>
        </div>
    </div>
</body>
</html>
