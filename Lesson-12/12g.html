<!DOCTYPE html>
<html>
<head>
    <style>
        p{
            font-family: Arial;
            margin-bottom: 0;
            margin-bottom: 0;
        }

        .row{
            display: flex;
            flex-direction: row;
            align-items: center;
            margin-bottom: 20px;
        }

        img{
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 25px;
            margin-right: 15px;
        }

        .info{
            width: 200px;
        }

        .name{
            font-weight: bold;
            margin-bottom: 3px;
        }

        .handle{
            color: rgb(150, 150, 150);
            margin-bottom: 5px;
        }

        .category{
            color: rgb(150, 150, 150);
            font-size: 14px;
        }

        button{
            background-color: rgb(57, 106, 211);
            color: white;
            padding-bottom: 7px;
            padding-top: 7px;
            padding-right: 10px;
            padding-left: 10px;
            border: none;
            border-radius: 5px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>
        <div class="row">
            <img src="/Lesson-12/cat1.webp">
            <div class="info">
                <p class="name">oliver</p>
                <p class="handle">the cat</p>
                <p class="category">Popular</p>
            </div>
            <button>Follow</button>
        </div>

        <div class="row">
            <img src="/Lesson-12/cat2.webp">
            <div class="info">
                <p class="name">Mimi</p>
                <p class="handle">Sleepy cat</p>
                <p class="category">Popular</p>
            </div>
            <button>Follow</button>
        </div>

        <div class="row">
            <img src="/Lesson-12/dog.webp">
            <div class="info">
                <p class="name">Rex</p>
                <p class="handle">Happy Bulldog</p>
                <p class="category">Popular</p>
            </div>
            <button>Follow</button>
        </div>
</body>
</html>
