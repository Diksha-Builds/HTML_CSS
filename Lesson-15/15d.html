<!DOCTYPE html>
<html>
<head>
    <style>
        body{
            height: 3000px;
        }

        .grey-box{
            width: 320px;
            height: 180px;
            background-color: gray;
            position: fixed;
            bottom: 20px;
            right: 20px;
        }

        .close-button{
            background-color: black;
            color: white;
            position: absolute;
            top: 15px;
            right: 15px;
            font-family: Arial;
            font-size: 20px;
            width: 45px;
            height: 45px;
            border-radius: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            top: -18px;
            left: -18px;
        }

        .video-time{
            background-color: black;
            color: white;
            font-family: Arial;
            font-size: 18px;
            position: absolute;
            right: 5px;
            bottom: 5px;
            padding-bottom: 5px;
            padding-top: 5px;
            padding-left: 10px;
            padding-right: 10px;
        }
    </style>
</head>
<body>
    <div class="grey-box">
        <div class="close-button">X</div>
        <div class="video-time">0:29</div>
    </div>
</body>
</html>
