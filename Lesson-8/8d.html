<!DOCTYPE html>
<html>
<head>
    <title>8d exercise</title>
    <style>
        input{
            display: inline-block;
            width: 120px;
            padding-left: 16px;
            padding-right: 16px;
            padding-top: 10px;
            padding-bottom: 10px;
            border-radius: 5px;
            border: solid;
            border-color: rgb(111, 109, 109);
            border-width: 1px;
            margin-bottom: 10px;
        }

        .email{
            display: block;
            padding-left: 16px;
            padding-right: 16px;
            padding-top: 10px;
            padding-bottom: 10px;
            border-radius: 5px;
            width: 278px;
        }

        button{
            background-color: rgb(25, 92, 192);
            color: white;
            padding-left: 16px;
            padding-right: 16px;
            padding-top: 10px;
            padding-bottom: 10px;
            border-radius: 5px;
            width: 310px;
            border: none;
        }
    </style>
</head>
<body>
    <input type="text" placeholder="First name">
    <input type="text" placeholder="Last name">
    <input class="email" type="text" placeholder="Email">
    <button>Sign Up</button>
</body>
</html>
