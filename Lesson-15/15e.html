<!DOCTYPE html>
<html>
<head>
    <style>
        .container{
            position: relative;
            display: inline-block;
        }

        .shirt-image{
            width: 300px;
            height: 300px;
            object-fit: contain;
        }

        .discount{
            position: absolute;
            top: 10px;
            right: 0px;
            background-color: black;
            color: white;
            padding-left: 10px;
            padding-right: 10px;
            padding-top: 7px;
            padding-bottom: 7px;
            font-family: Arial;
        }
    </style>
</head>
<body>
    <div class="container">
        <img class="shirt-image" src="/Lesson-15/shirt-image.webp">
        <div class="discount">20% OFF</div>
    </div>
</body>
</html>
